name: deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:

# Never let two deploys of the same branch overlap on the runner.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, hdr-vm]
    steps:
      - uses: actions/checkout@v4

      - name: Write .env from variables
        run: |
          umask 177
          cat > .env <<EOF
          ALLOWED_HOSTS=${{ vars.ALLOWED_HOSTS }}
          EOF

      # Free port 5180 before starting. Repo renames left stacks behind under old
      # Compose project names (oligo-facade-app, oligo-a-facade-app, ...) that still
      # hold the port, and `compose up` on the pinned "oligo" project cannot adopt or
      # evict them. Removing whatever publishes 5180 covers every past and future name
      # without maintaining a list. It may remove this stack's own container; the next
      # step recreates it anyway (--force-recreate).
      - name: Free port 5180
        run: docker ps -aq --filter publish=5180 | xargs -r docker rm -f

      - name: Build & (re)start container
        run: docker compose up -d --build --force-recreate

      - name: Prune dangling images
        run: docker image prune -f
