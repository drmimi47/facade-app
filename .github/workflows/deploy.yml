name: deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:

# Never let two deploys of the same branch overlap on the runner.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, hdr-vm]
    steps:
      - uses: actions/checkout@v4

      - name: Write .env from variables
        run: |
          umask 177
          cat > .env <<EOF
          ALLOWED_HOSTS=${{ vars.ALLOWED_HOSTS }}
          EOF

      # One-time cleanup after the repo rename (Oligo-facade-app -> oligo-a-facade-app).
      # Compose used to derive its project name from the checkout directory, so the
      # pre-rename stack is still running on the VM under the project
      # "oligo-facade-app" and still holds 127.0.0.1:5180. compose.yaml now pins the
      # project name, but that does not adopt the old stack — without this teardown the
      # new container cannot bind the port. Safe and idempotent: once the old stack is
      # gone this matches nothing. Remove this step after one successful deploy.
      - name: Tear down pre-rename stack
        run: docker compose -p oligo-facade-app down --remove-orphans || true

      - name: Build & (re)start container
        run: docker compose up -d --build --force-recreate

      - name: Prune dangling images
        run: docker image prune -f
