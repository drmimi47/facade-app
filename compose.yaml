# Compose project name is PINNED. By default Compose derives it from the checkout
# DIRECTORY name, which changes when the repo/folder is renamed (the self-hosted
# runner checks out into _work/<repo>/<repo>). Without this, a rename makes Compose
# treat the deploy as a brand-new stack, leaving the old container running and
# holding port 5180 so the new one fails to bind. Pinning it keeps every deploy
# targeting the same stack regardless of path.
name: oligo

services:
  oligo:
    build: .
    restart: unless-stopped
    # ALLOWED_HOSTS (public hostname for the Vite dev server) — created by the deploy
    # workflow. Oligo is client-only with no API keys, so there are no secrets here.
    env_file: .env
    # Bound to localhost only — the VM's existing nginx proxies to this port.
    ports:
      - "127.0.0.1:5180:5180"
